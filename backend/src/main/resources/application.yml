server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/meditrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET:meditrack-super-secret-jwt-key-2024-pharmacy-system-secure}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

  upload:
    dir: ${UPLOAD_DIR:./uploads}

  alerts:
    horizon-days: ${ALERT_HORIZON_DAYS:30}
    scan-enabled: ${ALERT_SCAN_ENABLED:true}
    scan-cron: ${ALERT_SCAN_CRON:0 0 6 * * *}

logging:
  level:
    com.meditrack: INFO
    org.springframework.security: WARN